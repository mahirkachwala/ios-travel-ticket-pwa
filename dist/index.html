<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005cf5">
  <meta name="description" content="A modular mobile travel ticket interface with booking history, dynamic ticket preview and feedback.">
  <title>iOS Travel Ticket PWA</title>
  <link rel="icon" href="assets/brand-logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="typography.css">
  <link rel="stylesheet" href="screens.css">
  <link rel="stylesheet" href="journey.css">
</head>
<body>
  <div id="workspace" class="workspace">
    <aside id="studio" class="studio" aria-label="Preview settings"></aside>
    <main class="preview-stage">
      <div class="preview-caption"><span class="live-dot"></span> LIVE PREVIEW <span class="preview-size">390 × 844</span></div>
      <div class="device">
        <div id="app" class="mobile-app"></div>
      </div>
      <p class="preview-footnote">Interactive UI prototype · Demo ticket</p>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
